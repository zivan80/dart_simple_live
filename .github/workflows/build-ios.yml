name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable Flutter iOS
        run: flutter config --enable-ios

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build iOS IPA
        run: |
          cd simple_live_app
          flutter_distributor package --platform ios --targets ipa --skip-clean

      - name: Upload iOS IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            simple_live_app/build/dist/*/*.ipa

      - name: Echo Status
        run: echo "🍏 iOS build job completed successfully with status ${{ job.status }}."
