name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable Flutter iOS
        run: flutter config --enable-ios

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build iOS App (No Codesign)
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      - name: Package into IPA for LiveContainer
        run: |
          cd simple_live_app
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r simple_live.ipa Payload

      - name: Upload iOS IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: simple_live_app/simple_live.ipa
