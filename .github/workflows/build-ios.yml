name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write # 必须赋予写入权限，以便 Actions 能够自动创建 Release 并上传文件
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable Flutter iOS
        run: flutter config --enable-ios

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build iOS App (No Codesign)
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      - name: Package into IPA for LiveContainer
        run: |
          cd simple_live_app
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r dart_simple_live.ipa Payload

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v1
        with:
          files: simple_live_app/dart_simple_live.ipa
          tag_name: v1.0.${{ github.run_number }} # 自动生成唯一的版本号标签 (例如 v1.0.5)
          name: "Dart Simple Live - v1.0.${{ github.run_number }}"
          body: "Automated build for LiveContainer (No codesign required)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
